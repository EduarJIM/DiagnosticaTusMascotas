name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar (Windows / .NET 10)
    runs-on: windows-latest

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restaurar paquetes
        run: dotnet restore DiagnosticaTuMascota.sln

      - name: Compilar en Release
        run: dotnet build DiagnosticaTuMascota.sln -c Release --no-restore

      - name: Verificar SDK y paquetes
        run: |
          dotnet --info
          dotnet list DiagnosticaTuMascota/DiagnosticaTuMascota.csproj package

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: DiagnosticaTuMascota-Release
          path: DiagnosticaTuMascota/bin/Release/net10.0-windows/
          if-no-files-found: error
